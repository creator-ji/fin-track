name: CI

on:
  push:
    branches: [main, master, 'check-by-list']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn -B -q test
      - name: Verify (Checkstyle)
        run: mvn -B -q verify -DskipTests
